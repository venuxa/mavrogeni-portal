<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavrogeni - Gestión Citopatología</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- TOPBAR -->
    <header class="bg-teal-800 text-white p-4 flex justify-between items-center shadow-lg">
        <h1 class="font-bold text-lg"><i class="fa-solid fa-microscope mr-2"></i> Mavrogeni HRA</h1>
        <div id="usuario-display" class="text-xs font-bold bg-teal-900 px-3 py-1 rounded-full"></div>
    </header>

    <!-- MAIN APP -->
    <main class="flex-1 p-4 overflow-y-auto pb-32">
        <!-- ÁREA CITODIAGNÓSTICO -->
        <div id="section-cito" class="space-y-6">
            
            <!-- CABECERA ACCIONES -->
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">Flujo de Muestras</h2>
                <button onclick="abrirModal('modal-ingreso')" class="bg-teal-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow hover:bg-teal-700">
                    <i class="fa-solid fa-plus mr-1"></i> Ingresar Nueva Rutina
                </button>
            </div>

            <!-- TABLERO KANBAN -->
            <div class="flex gap-4 overflow-x-auto pb-4 h-[400px]">
                <div class="w-64 bg-gray-200 rounded-xl p-3 flex flex-col"><h3 class="font-bold text-xs mb-2">Recepción</h3><div id="col-secretaria" class="flex-1 space-y-2"></div></div>
                <div class="w-64 bg-gray-200 rounded-xl p-3 flex flex-col"><h3 class="font-bold text-xs mb-2">En Proceso (TENS)</h3><div id="col-tens" class="flex-1 space-y-2"></div></div>
                <div class="w-64 bg-gray-200 rounded-xl p-3 flex flex-col"><h3 class="font-bold text-xs mb-2">Validación (TM)</h3><div id="col-tm" class="flex-1 space-y-2"></div></div>
                <div class="w-64 bg-gray-200 rounded-xl p-3 flex flex-col"><h3 class="font-bold text-xs mb-2">Médico Patólogo</h3><div id="col-final" class="flex-1 space-y-2"></div></div>
            </div>

            <!-- REGISTRO HISTÓRICO Y BUSCADOR -->
            <div class="bg-white p-4 rounded-xl shadow border">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-gray-700">Registro Histórico</h3>
                    <input type="date" id="filtro-fecha" onchange="renderHistorial()" class="border rounded p-1 text-sm bg-gray-50">
                </div>
                <div id="historial-container" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- MODAL INGRESO RUTINA (MÚLTIPLE) -->
    <div id="modal-ingreso" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full max-h-[85vh] overflow-y-auto">
            <h2 class="font-bold text-lg mb-4">Asignar Rutina Diaria</h2>
            <div id="rutina-inputs-container" class="space-y-4">
                <!-- 4 Filas de tecnólogos -->
                <script>
                    ['FJ', 'PA', 'SA', 'LE'].forEach(tm => {
                        document.write(`
                            <div class="border-b pb-2">
                                <label class="text-[10px] font-bold text-gray-500 uppercase">${tm}</label>
                                <div class="grid grid-cols-2 gap-2 mt-1">
                                    <input type="text" id="r-${tm}-r" placeholder="Folios (Ej: 1-10)" class="border p-1 text-xs rounded">
                                    <input type="number" id="r-${tm}-c" placeholder="Cant" class="border p-1 text-xs rounded r-calc" oninput="sumarTotalRutina()">
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
            <div class="mt-4 font-bold text-right text-sm bg-gray-100 p-2 rounded">Total Diario: <span id="rutina-total">0</span></div>
            <button onclick="guardarNuevaRutina()" class="w-full bg-teal-600 text-white font-bold py-3 mt-4 rounded-lg">Publicar Rutina</button>
        </div>
    </div>

    <!-- MODAL VALIDACIÓN TM -->
    <div id="modal-tm-validacion" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h2 class="font-bold text-lg mb-4">Validación Técnica</h2>
            <input type="hidden" id="tm-lote-id">
            <div class="grid grid-cols-2 gap-3">
                <input type="number" id="tm-neg" placeholder="Negativos" class="border p-2 text-sm rounded">
                <input type="number" id="tm-pos" placeholder="Positivos" class="border p-2 text-sm rounded">
            </div>
            <select id="tm-patologo" class="w-full border p-2 text-sm rounded mt-3">
                <option>DR BENITEZ</option><option>DRA GARCIA</option><option>DR VIDAL</option>
            </select>
            <button onclick="guardarValidacion()" class="w-full bg-teal-700 text-white font-bold py-3 mt-4 rounded-lg">Finalizar y Enviar a Patólogo</button>
        </div>
    </div>

    <script>
        let lotes = JSON.parse(localStorage.getItem('mvrg_lotes')) || [];

        function abrirModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function cerrarModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function sumarTotalRutina() {
            let total = 0;
            document.querySelectorAll('.r-calc').forEach(i => total += parseInt(i.value) || 0);
            document.getElementById('rutina-total').innerText = total;
        }

        function guardarNuevaRutina() {
            ['FJ', 'PA', 'SA', 'LE'].forEach(tm => {
                let rango = document.getElementById(`r-${tm}-r`).value;
                let cant = parseInt(document.getElementById(`r-${tm}-c`).value) || 0;
                if(cant > 0) {
                    lotes.push({ id: Date.now()+Math.random(), tm: tm, rango: rango, cant: cant, estado: 'secretaria', fecha: new Date().toISOString().split('T')[0], trazabilidad: ['Lote creado por Secretaría'] });
                }
            });
            localStorage.setItem('mvrg_lotes', JSON.stringify(lotes));
            cerrarModal('modal-ingreso');
            renderTablero();
        }

        function renderTablero() {
            ['secretaria', 'tens', 'tm', 'final'].forEach(col => document.getElementById('col-'+col).innerHTML = '');
            lotes.forEach(l => {
                let card = `
                    <div class="bg-white p-3 rounded-lg shadow text-xs">
                        <p class="font-bold">${l.tm} | Rango: ${l.rango}</p>
                        <p class="text-gray-500">Cant: ${l.cant}</p>
                        <div class="mt-2 flex gap-1">
                            ${l.estado==='secretaria' ? `<button onclick="cambiarEstado(${l.id}, 'tens')" class="bg-orange-500 text-white px-2 py-1 rounded">Aceptar TENS</button>` : ''}
                            ${l.estado==='tens' ? `<button onclick="abrirValidacion(${l.id})" class="bg-teal-600 text-white px-2 py-1 rounded">Validar TM</button>` : ''}
                            <button onclick="alert('${l.trazabilidad.join(' -> ')}')" class="bg-gray-100 text-gray-600 px-2 py-1 rounded"><i class="fa-solid fa-clock"></i></button>
                        </div>
                    </div>`;
                document.getElementById('col-'+l.estado).innerHTML += card;
            });
            renderHistorial();
        }

        function cambiarEstado(id, nuevo) {
            let l = lotes.find(x => x.id === id);
            l.estado = nuevo;
            l.trazabilidad.push(`Movido a ${nuevo}`);
            localStorage.setItem('mvrg_lotes', JSON.stringify(lotes));
            renderTablero();
        }

        function abrirValidacion(id) { document.getElementById('tm-lote-id').value = id; abrirModal('modal-tm-validacion'); }

        function guardarValidacion() {
            let id = document.getElementById('tm-lote-id').value;
            let l = lotes.find(x => x.id == id);
            l.negativos = document.getElementById('tm-neg').value;
            l.positivos = document.getElementById('tm-pos').value;
            l.patologo = document.getElementById('tm-patologo').value;
            l.estado = 'final';
            l.trazabilidad.push('Validado por TM y enviado a Patólogo');
            localStorage.setItem('mvrg_lotes', JSON.stringify(lotes));
            cerrarModal('modal-tm-validacion');
            renderTablero();
        }

        function renderHistorial() {
            const container = document.getElementById('historial-container');
            const fechaFiltro = document.getElementById('filtro-fecha').value;
            container.innerHTML = '';
            lotes.filter(l => !fechaFiltro || l.fecha === fechaFiltro).forEach(l => {
                container.innerHTML += `
                    <div class="flex justify-between items-center p-2 border-b text-xs">
                        <span>${l.fecha} | TM: ${l.tm} | ${l.rango}</span>
                        <button onclick="alert('${l.trazabilidad.join(' -> ')}')" class="text-teal-700 font-bold"><i class="fa-solid fa-clock"></i> Trazabilidad</button>
                    </div>`;
            });
        }

        renderTablero();
    </script>
</body>
</html>
